name: Canadian regional checks
on:
  workflow_dispatch:
  schedule:
    - cron: '23 15 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/canada-probes.yml'
      - 'admin/canada-probes.mjs'
      - 'scripts/check_canada.mjs'
permissions:
  contents: read
jobs:
  canadian-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node scripts/check_canada.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canadian-probe-observations
          path: canada-probes.json
          retention-days: 30
