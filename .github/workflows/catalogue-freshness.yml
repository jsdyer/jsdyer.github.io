name: Catalogue · Refresh data dates

on:
  schedule:
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalogue-freshness.yml'
      - 'scripts/refresh_dates.py'
      - 'scripts/save_refresh_history.py'
      - 'scripts/sync_guides.py'
      - 'scripts/sync_manifests.py'

concurrency:
  group: catalogue-data-dates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read dates and counts from published tools
        id: metadata
        run: python3 scripts/refresh_dates.py --journal-entry "$RUNNER_TEMP/metadata-entry.json"
      - name: Read tool README notes and opted-in project listing copy
        id: guides
        continue-on-error: true
        run: python3 scripts/sync_guides.py --with-manifests
      - name: Regenerate the catalogue and run its checks
        run: |
          python3 scripts/sync_readme.py
          python3 -m unittest discover -s tests
          python3 scripts/build.py
      - name: Save changed dates and publish the catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- data/tools.json README.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/tools.json README.md
            git commit -m "Sync catalogue dates, listing copy and tool guide notes"
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          elif [ "${GITHUB_RUN_ATTEMPT}" -gt 1 ]; then
            gh workflow run pages.yml --ref main
          fi
      - name: Report any tool guides or manifests that need review
        if: steps.guides.outcome == 'failure'
        run: exit 1

      - name: Record this metadata check in the refresh journal
        if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
        run: |
          branch=catalogue-refresh-log
          folder="$RUNNER_TEMP/refresh-journal"
          base=HEAD
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null; then
            git fetch --no-tags --depth=1 origin "refs/heads/$branch"
            base=FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          git worktree add --detach "$folder" "$base"
          python3 scripts/save_refresh_history.py "$folder/refresh-history.json" "$RUNNER_TEMP/metadata-entry.json"
          git -C "$folder" add -- refresh-history.json
          if ! git -C "$folder" diff --cached --quiet; then
            git -C "$folder" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Record metadata check $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            git push origin "$(git -C "$folder" rev-parse HEAD):refs/heads/$branch"
          fi
