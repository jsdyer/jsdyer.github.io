name: Catalogue · Refresh data dates

on:
  schedule:
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalogue-freshness.yml'
      - 'scripts/refresh_dates.py'
      - 'scripts/sync_guides.py'

concurrency:
  group: catalogue-data-dates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read dates and counts from published tools
        run: python3 scripts/refresh_dates.py
      - name: Read the guide note from each tool README
        id: guides
        continue-on-error: true
        run: python3 scripts/sync_guides.py
      - name: Regenerate the catalogue and run its checks
        run: |
          python3 scripts/sync_readme.py
          python3 -m unittest discover -s tests
          python3 scripts/build.py
      - name: Save changed dates and publish the catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- data/tools.json README.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/tools.json README.md
            git commit -m "Sync catalogue dates and tool guide notes"
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          elif [ "${GITHUB_RUN_ATTEMPT}" -gt 1 ]; then
            gh workflow run pages.yml --ref main
          fi
      - name: Report any tool guides that need review
        if: steps.guides.outcome == 'failure'
        run: exit 1
