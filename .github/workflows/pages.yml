name: Catalogue · Check and publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: catalogue-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Validate and build catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check README tool directory is in sync
        run: python3 scripts/sync_readme.py --check
      - name: Check catalogue integration and generated operations
        run: python3 scripts/check_integration.py
      - name: Check catalogue excerpts against the tool guides in this checkout
        run: python3 scripts/sync_guides.py --local --check
      - name: Test catalogue validation and rendering
        run: python3 -m unittest discover -s tests -v
      - name: Build static site
        run: python3 scripts/build.py
      - name: Check built catalogue and sitemap coverage
        run: python3 scripts/check_integration.py --built
      - name: Test admin reporting and service checks
        run: node --test tests/*.test.mjs
      - name: Install browser test dependencies
        run: |
          python3 -m pip install -r tests/browser-requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Check catalogue in a browser
        run: python3 tests/browser_smoke.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalogue-browser-checks
          path: browser-checks/
          retention-days: 7
      - name: Save reviewable site
        uses: actions/upload-artifact@v7
        with:
          name: catalogue-preview
          path: dist/
          include-hidden-files: true
          retention-days: 7
      - name: Package Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  watchdog:
    name: Validate independent watchdog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r services/refresh-watchdog/requirements.txt
      - run: python3 -m unittest discover -s services/refresh-watchdog -p 'test_*.py' -v
      - run: python3 services/refresh-watchdog/watchdog.py --config services/refresh-watchdog/targets.json --check-config
      - name: Read a real systemd DynamicUser credential
        run: |
          sudo systemd-run --unit=coolcode-credential-check --wait --pipe --collect \
            -p DynamicUser=yes -p LoadCredential=probe:/etc/hostname \
            "$(command -v python3)" -c '
          import os, sys
          from pathlib import Path
          sys.path.insert(0, sys.argv[1])
          from watchdog import secure_read
          credential = Path(os.environ["CREDENTIALS_DIRECTORY"]) / "probe"
          assert secure_read(credential), "Test credential must not be empty"
          print("Read systemd credential successfully; mode=" + oct(credential.stat().st_mode & 0o777))
          ' "$PWD/services/refresh-watchdog"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, watchdog]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: publish
