name: Catalogue · Check and publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check README tool directory is in sync
        run: python3 scripts/sync_readme.py --check
      - name: Check catalogue excerpts against the tool guides in this checkout
        run: python3 scripts/sync_guides.py --local --check
      - name: Test catalogue validation and rendering
        run: python3 -m unittest discover -s tests -v
      - name: Check Atlantic Dial time zones and calendar export
        run: node --test tests/atlanticdial.test.mjs
      - name: Build static site
        run: python3 scripts/build.py
      - name: Install browser test dependencies
        run: |
          python3 -m pip install -r tests/browser-requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Check catalogue in a browser
        run: python3 tests/browser_smoke.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalogue-browser-checks
          path: browser-checks/
          retention-days: 7
      - name: Save reviewable site
        uses: actions/upload-artifact@v7
        with:
          name: catalogue-preview
          path: dist/
          include-hidden-files: true
          retention-days: 7
      - name: Package Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
