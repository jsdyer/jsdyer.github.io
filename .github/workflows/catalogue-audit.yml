name: Catalogue · Link audit

on:
  schedule:
    - cron: '17 15 * * 1'
  workflow_dispatch:
    inputs:
      search_inventory:
        description: Save an inventory of public tool pages and linked preset candidates
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  repository-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/requirements-maintenance.txt
      - name: Check complete public repository coverage
        run: python3 scripts/audit_repositories.py --check
      - name: Detect changed schedules, inputs and missing guards
        if: '!cancelled()'
        run: python3 scripts/sync_operations.py --refresh --check
      - name: Check verified Worker deployment receipt
        if: '!cancelled()'
        run: python3 scripts/check_integration.py --deployment
      - name: Check deployed Cloudflare tool registration
        if: '!cancelled()'
        run: python3 scripts/check_live_registry.py

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 scripts/audit_links.py
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalogue-link-audit
          path: link-audit.json
          retention-days: 30


  search-inventory:
    if: github.event_name == 'workflow_dispatch' && inputs.search_inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 scripts/audit_search.py
      - uses: actions/upload-artifact@v7
        with:
          name: catalogue-search-inventory
          path: search-audit.json
          retention-days: 30
