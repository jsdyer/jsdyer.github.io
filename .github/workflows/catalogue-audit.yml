name: Catalogue · Link audit

on:
  schedule:
    - cron: '17 15 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlantic-dial:
    name: Check station programme listings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/check_atlantic_dial.py

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 scripts/audit_links.py
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalogue-link-audit
          path: link-audit.json
          retention-days: 30
