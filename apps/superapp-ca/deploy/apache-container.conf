<VirtualHost *:80>
    ServerName superapp.ca
    DocumentRoot /var/www/superapp/public
    <Directory /var/www/superapp/public>
        Require all granted
        Options -Indexes -MultiViews
        AllowOverride None
        DirectoryIndex index.php
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
        CGIPassAuth On
    </Directory>
    LimitRequestBody 2100000
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
