# Install only after replacing paths and issuing your TLS certificate.
<VirtualHost *:80>
    ServerName superapp.ca
    Redirect permanent / https://superapp.ca/
</VirtualHost>
<VirtualHost *:443>
    ServerName superapp.ca
    DocumentRoot /var/www/superapp/public
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/superapp.ca/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/superapp.ca/privkey.pem
    <Directory /var/www/superapp/public>
        Require all granted
        Options -Indexes -MultiViews
        AllowOverride None
        DirectoryIndex index.php
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
        CGIPassAuth On
    </Directory>
    LimitRequestBody 2100000
    ErrorLog ${APACHE_LOG_DIR}/superapp-error.log
    CustomLog ${APACHE_LOG_DIR}/superapp-access.log combined
</VirtualHost>
