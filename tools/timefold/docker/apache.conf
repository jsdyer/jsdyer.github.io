<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

ServerTokens Prod
ServerSignature Off
ServerName localhost
